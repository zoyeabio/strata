{{ define "main" }}
{{- $termParams := site.Params.term }}
<header class="page-header">
  {{ partial "page/breadcrumbs.html" . }}
  <h1>{{ .Title | emojify }}</h1>
  <p class="page-header__meta">{{ len .Pages }} articles</p>
</header>
{{- partial "page/page-content.html" . }}
{{- partial "page/paginated.html" (dict "page" . "params" $termParams) }}
{{ end }}
