{{- /*
  Partial: head/schema.html
  Role:     JSON-LD graph: WebSite (home), WebPage (every rendered page),
            Article (dated content — the same condition as og:type=article).
  Params:   page (Page, required)
  Outputs:  <script type="application/ld+json"> with a @graph
  Called by: head/head.html
*/ -}}
{{- $page := . }}
{{- if ne $page.Kind "404" }}
{{- $isHome := eq $page.Kind "home" }}
{{- $isArticle := and (eq $page.Kind "page") (not $page.Date.IsZero) }}
{{- $lang := site.Language.Locale | default "en" }}
{{- $websiteID := printf "%s#website" site.Home.Permalink }}
{{- $orgID := printf "%s#organization" site.Home.Permalink }}
{{- $graph := slice }}
{{- if $isHome }}
{{- $graph = append (dict
    "@context" "https://schema.org"
    "@type" "WebSite"
    "@id" $websiteID
    "name" site.Title
    "url" site.Home.Permalink
    "inLanguage" $lang) $graph }}
{{- end }}
{{- $org := dict
    "@context" "https://schema.org"
    "@type" "Organization"
    "@id" $orgID
    "name" (site.Params.footer.company.name | default site.Title)
    "url" site.Home.Permalink }}
{{- with site.Params.footer.social.links }}
{{- $org = merge $org (dict "sameAs" (apply . "index" "." "url")) }}
{{- end }}
{{- with site.Params.logo }}{{ with resources.Get . }}
{{- $org = merge $org (dict "logo" (.Permalink)) }}
{{- end }}{{ end }}
{{- $graph = append $org $graph }}
{{- $graph = append (dict
    "@context" "https://schema.org"
    "@type" "WebPage"
    "@id" (printf "%s#webpage" $page.Permalink)
    "url" $page.Permalink
    "name" $page.Title
    "isPartOf" (dict "@id" $websiteID)
    "inLanguage" $lang) $graph }}
{{- if not $isHome }}
{{- $crumbs := slice (dict "@type" "ListItem" "position" 1 "name" "Home" "item" site.Home.Permalink) }}
{{- $ancestors := slice }}
{{- $p := $page.Parent }}
{{- range seq 10 }}{{ if and $p (not $p.IsHome) }}{{ $ancestors = $ancestors | append $p }}{{ $p = $p.Parent }}{{ end }}{{ end }}
{{- range $ancestors | collections.Reverse }}
{{- $crumbs = $crumbs | append (dict "@type" "ListItem" "position" (add (len $crumbs) 1) "name" .LinkTitle "item" .Permalink) }}
{{- end }}
{{- $crumbs = $crumbs | append (dict "@type" "ListItem" "position" (add (len $crumbs) 1) "name" $page.LinkTitle "item" $page.Permalink) }}
{{- $graph = append (dict
    "@context" "https://schema.org"
    "@type" "BreadcrumbList"
    "@id" (printf "%s#breadcrumb" $page.Permalink)
    "itemListElement" $crumbs) $graph }}
{{- end }}
{{- if $isArticle }}
{{- $img := partial "data/image-resource.html" (dict
    "ref" (partial "data/image-ref.html" (dict "page" $page "social" true))
    "page" $page
    "role" "og"
    "alt" ($page.Params.featureimagealt | default (printf "Featured image for %s" $page.Title))) }}
{{- $article := dict
    "@context" "https://schema.org"
    "@type" "Article"
    "@id" (printf "%s#article" $page.Permalink)
    "headline" $page.Title
    "url" $page.Permalink
    "mainEntityOfPage" (dict "@type" "WebPage" "@id" (printf "%s#webpage" $page.Permalink))
    "publisher" (dict "@id" $orgID) }}
{{- $author := $page.Params.author | default site.Params.author.name | default "" }}
{{- if $author }}
{{- $person := dict "@type" "Person" "name" $author }}
{{- with site.Params.author.links }}
{{- $person = merge $person (dict "sameAs" (apply . "index" "." "url")) }}
{{- end }}
{{- $article = merge $article (dict "author" $person) }}
{{- end }}
{{- with partial "data/description.html" $page }}
{{- $article = merge $article (dict "description" .) }}
{{- end }}
{{- $kw := partial "data/keywords.html" $page }}
{{- with $kw }}
{{- $article = merge $article (dict "keywords" $kw) }}
{{- end }}
{{- if not $page.PublishDate.IsZero }}
{{- $article = merge $article (dict "datePublished" ($page.PublishDate.Format "2006-01-02T15:04:05Z07:00")) }}
{{- end }}
{{- if not $page.Lastmod.IsZero }}
{{- $article = merge $article (dict "dateModified" ($page.Lastmod.Format "2006-01-02T15:04:05Z07:00")) }}
{{- end }}
{{- /* The 1200x630 preview plus the widest hero variant. Google asks for a
       high-resolution 16:9 representative image where one exists; the hero
       variant is already built for the page, so no extra file is produced */ -}}
{{- $hero := partial "data/image-resource.html" (dict
    "ref" (partial "data/image-ref.html" (dict "page" $page))
    "page" $page
    "role" "hero"
    "alt" ($page.Params.featureimagealt | default (printf "Featured image for %s" $page.Title))) }}
{{- $images := slice -}}
{{- if $img.ok }}{{ $images = $images | append ($img.url | absURL) }}{{ end -}}
{{- if and $hero.ok $hero.url (ne $hero.url $img.url) }}{{ $images = $images | append ($hero.url | absURL) }}{{ end -}}
{{- with $images }}
{{- $article = merge $article (dict "image" $images) }}
{{- end }}
{{- $graph = append $article $graph }}
{{- end }}
<script type="application/ld+json">{{ $graph | jsonify | safeJS }}</script>
{{- end }}
