{{- /*
  Hero media block: the featured image at the top of a page.

  Input dict
    img (dict, required) — the result of data/hero-image.html; nothing is
         printed when img.ok is false

  Called by: _default/single.html, _default/list.html
*/ -}}
{{- if .img.ok }}
<figure class="page-hero">
  {{- partial "media/image.html" (dict
      "img" .img
      "alt" .img.alt
      "sizes" .img.sizes
      "loading" "eager"
      "fetchpriority" "high"
      "class" "page-hero__image") }}
</figure>
{{- end }}
