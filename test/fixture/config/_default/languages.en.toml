# `description` sits at the top level on purpose: that is the language's own
# description, not [params] description. [params] description is deliberately
# left unset so the fixture inherits the theme's, which means pages without a
# front matter description exercise the site-level fallback in
# data/description.html. scripts/smoke.sh builds once more against the
# config/nodesc/ overlay to reach the last resort past that.
title = "Strata Fixture"
description = "Rendered assertions for the theme"

[params]
dateFormat = "2 Jan 2006"
