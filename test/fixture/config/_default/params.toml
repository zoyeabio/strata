eagerCardCount = 2
mainSections = ["section-a"]
twitterSite = "@fixturetest"
twitterCreator = "@fixturecreator"
enableSearch = true
enableA11y = true
schemaLogo = "/android-chrome-512x512.png"

[header]
  layout = "smart"

[search]
  contentLength = 600

[list]
  cardView = true
  showBreadcrumbs = true
  showHero = true

[article]
  showBreadcrumbs = true
  showAuthor = true
  showDateUpdated = true
  showRelatedContent = true
  relatedContentLimit = 3
  showPagination = true
  showSummary = true
  sharingLinks = ["linkedin", "facebook", "email", "whatsapp"]

[author]
  name = "Fixture Team"
  url = "/notice/"
  links = [
    { name = "Profile", url = "https://author.example.net/" },
    { name = "Mail", url = "mailto:team@example.net" },
    { name = "Upper Mail", url = "MAILTO:upper@example.net" },
  ]

[ads]
  client = "ca-pub-0000000000000000"
  consent = "gated"
  [ads.slots]
    belowHero = "8888888888"
    belowArticle = "9999999999"
    minWords = 0

[taxonomy]
  showBreadcrumbs = true

# Terms exercise the trail through a taxonomy ancestor, which has no menu
# entry, so the crumb falls back to LinkTitle.
[term]
  showBreadcrumbs = true

[footer]
  showAppearanceSwitcher = true
  showScrollToTop = true

  [footer.company]
    name = "Fixture Co."
    slogan = "A test slogan."
    email = "info@example.net"
    phone = "+1 555 0100"
    address = "1 Test Street<br>Testville"

  [footer.quickLinks]
    title = "Quick Links"
    links = [
      { name = "Section A", url = "/section-a/" },
      { name = "Mail", url = "mailto:hello@example.net" },
      { name = "Upper Mail", url = "MAILTO:Case@example.net" },
    ]

  [footer.legal]
    title = "Legal"
    links = [
      { name = "Flat", url = "/section-a/flat/" },
      { name = "Mail", url = "mailto:legal@example.net" },
    ]

  [footer.social]
    links = [
      { name = "Check", icon = "check", url = "https://social.example.net/" },
      { name = "LinkedIn", icon = "linkedin", url = "https://linkedin.example.net/" },
      { name = "Fallback", icon = "no-such-icon", url = "/section-a/flat/" },
      { name = "Email", icon = "email", url = "mailto:hello@example.net" },
    ]
