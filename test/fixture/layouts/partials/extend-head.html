{{- /*
  Cached head hook of the fixture site. Loads the site-owned consent
  controller as a fingerprinted file reference: static/_headers keeps
  script-src 'self' with no unsafe-inline, so an inline <script> would be
  blocked. The controller drives js/ads.js in [ads] consent "gated" mode.

  Called by: partials/head/head.html
*/ -}}
{{ with resources.Get "js/consent.js" }}
{{ $consent := . | fingerprint "sha512" }}
<script defer src="{{ $consent.RelPermalink }}" integrity="{{ $consent.Data.Integrity }}"></script>
{{ end }}
