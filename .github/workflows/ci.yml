# Run the four gates CONTRIBUTING lists before a push, on GitHub.
#
# Inputs: the checkout, plus Hugo Extended, Node with npm, Python 3.11+ and Go.
# Callers: pushes to main and pull requests. Every step is one of the four
# scripts; there is no extra check here that a contributor cannot run locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"
          # No go.sum: the module declares no Go dependencies, so there is
          # nothing for the cache key to read and every run would warn.
          cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Hugo Extended
        env:
          HUGO_VERSION: "0.167.0"
          HUGO_SHA256: "0163f5c3deddac1f494a1629ddc40c65d18de9d5794facd98f7f96ac2c7d8957"
        run: |
          curl -sSfL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  /tmp/hugo.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install -m 0755 /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Install build and gate dependencies
        run: |
          npm ci
          python3 -m pip install pyyaml==6.0.3

      - name: Fixture contract assertions
        run: ./scripts/smoke.sh

      - name: Production build, output rules, example coverage
        run: ./scripts/validate-theme.sh

      - name: Example site as a site
        run: ./scripts/validate-site.sh exampleSite

      - name: Orphan / missing partials
        run: ./scripts/audit-partials.sh layouts
