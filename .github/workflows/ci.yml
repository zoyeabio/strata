# Run the four gates CONTRIBUTING lists before a push, on GitHub.
#
# Inputs: the checkout, plus Hugo Extended, Node with npm, Python 3.11+ and Go.
# Callers: pushes to main and pull requests. Every step is one of the four
# scripts; there is no extra check here that a contributor cannot run locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          # No go.sum: the module declares no Go dependencies, so there is
          # nothing for the cache key to read and every run would warn.
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugo Extended
        env:
          HUGO_VERSION: "0.167.0"
        run: |
          curl -sSfL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install -m 0755 /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Install build and gate dependencies
        run: |
          npm ci
          python3 -m pip install pyyaml

      - name: Fixture contract assertions
        run: ./scripts/smoke.sh

      - name: Production build, output rules, example coverage
        run: ./scripts/validate-theme.sh

      - name: Example site as a site
        run: ./scripts/validate-site.sh exampleSite

      - name: Orphan / missing partials
        run: ./scripts/audit-partials.sh layouts
