# Version floor declared for Hugo itself when the theme is consumed as a
# module: theme.toml's min_version is read only by galleries, while this is
# read by the module loader. Note the strength — Hugo answers an older
# version with a "not compatible" WARN, not a refused build, so the floor
# surfaces the incompatibility rather than enforcing it. Hugo 0.161.0 is
# the floor because that is where css.TailwindCSS starts running the
# Tailwind CLI through the npm binary.

[module.hugoVersion]
  extended = true
  min = "0.161.0"
