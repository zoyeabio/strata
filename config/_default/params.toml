# Strata's defaults for every key the theme reads from site.Params.
#
# Hugo merges this underneath your site's config, so a site value for any key
# wins here. Override one key and it wins in the templates and in
# scripts/lib/build_config.py alike, which resolve this same file pair.
# Environment overlays (config/production/) are honoured by both, and
# --environment names another.
#
# Keys keep their case: Hugo lowercases front matter keys but not config keys.
# The two exceptions are [image] and [build] below, whose keys are lowercase
# because scripts/lib/build_config.py reads the file through tomllib.
#
# [mainSections] is deliberately absent. An empty slice is truthy in Go
# templates, and _default/single.html reads it through `with`, so writing
# `mainSections = []` here would flip "every single is an article" into
# "none is". Absent means every single is an article.
#
# A bare top-level key in languages.<lang>.toml is invisible to the theme:
# dateFormat and the like must sit under a [params] table, as they do here.

colorScheme = "default"
defaultAppearance = "light"
autoSwitchAppearance = true
dateFormat = "2006-01-02"
robots = "index, follow, max-image-preview:large"
# Links to another host open in a new tab, so a reference never takes a reader
# out of the article they are mid-way through. Internal and mailto links always
# navigate in place — site navigation must stay in the tab.
externalLinksNewTab = true
eagerCardCount = 6
# Widest reading column, in pixels. Applies to article bodies only — list and
# landing pages keep the full frame. The column is centred and the text inside
# stays left-aligned. Below the measure the frame is narrower, so on a phone the
# body is flush with the title. "none" lifts the cap.
readingMeasure = 720
rtl = false
allowRemoteImages = false
disableImageOptimization = false
disableTextInHeader = false
enableSearch = false
enableA11y = false
logo = ""
# Dedicated Organization.logo image for structured data. Keep this separate
# from a wide header wordmark; use a crawlable square image at least 112px.
schemaLogo = ""
copyright = "© { year } Strata"
description = "A Hugo theme for content sites."
defaultSocialImage = ""
twitterSite = ""
twitterCreator = ""
customCSS = []

[header]
layout = "standard"

[search]
contentLength = 2000

[list]
cardView = true
showHero = false
orderByWeight = false
showSummary = false
showBreadcrumbs = false

[article]
showBreadcrumbs = false
showAuthor = false
showDate = true
showDateUpdated = true
# true, unlike [list].showSummary: that one is about cards, where a summary
# competes with the title. A page's own summary is written for a reader, so a
# page that supplies one shows it under the h1.
showSummary = true
# showToc displays a table of contents generated from headings for long articles.
# Default is false; site or per-page front matter can set it to true.
showToc = false
showRelatedContent = false
relatedContentLimit = 3
showPagination = true
sharingLinks = []

[author]
name = ""
# The author's own page. Emits the byline link and the JSON-LD Person url;
# Hugo's authorship is a reserved key, so this is a URL rather than a taxonomy.
url = ""
links = []

[taxonomy]
# cardView is false here and true in [list]: /tags/ lists terms, not articles,
# so it starts as a plain row list.
cardView = false
# showTermCount prints the count beside each term link.
showTermCount = true
showBreadcrumbs = false

[term]
cardView = false
orderByWeight = false
showSummary = false
showBreadcrumbs = false

[footer]
# showAppearanceSwitcher and showScrollToTop live here on purpose: the switcher
# is wired by assets/js/appearance.js, the floating button by
# assets/js/scroll-top.js.
showCompanyInfo = true
showAppearanceSwitcher = false
showScrollToTop = false

[ads]
client = ""
# "" (default): off — the loader ships only on pages that use the ads
# shortcode, so it never loads anywhere it was not placed. true: site-wide
# loader with no shortcode placed anywhere (except pages with `ads: false`);
# Google's Auto ads then choose pages and placement (anchor, interstitial,
# in-page) from the AdSense console. Manual units and auto placement are
# independent and can coexist.
auto = false
# The head loader fails the build when static/_headers would block
# pagead2.googlesyndication.com. Set this only when the host applies response
# headers itself and the _headers file never reaches the reader.
skipCspCheck = false

[ads.slots]
# Config-driven ad slots for article pages. Disabled by default ("").
# Supply numeric slot IDs from your AdSense dashboard to activate.
# Per-page front matter `ads: false` suppresses every theme-controlled ad on
# that page: configured slots, explicit ads shortcodes and the Auto ads loader.
belowHero = ""
belowArticle = ""
# Minimum word count required to display slots. This is a site-defined density
# guard, not a substitute for reviewing the current ad-network policies.
minWords = 800
# REQUIRED once [ads] client is set and any ad is unlocked — there is no
# default, so a site that forgets the line fails its build instead of
# asking Google silently. Two values:
#   "gated": the site keeps the answer and this theme obeys it — the
#     fingerprinted js/ads.js injects the loader only once the answer is
#     granted, so a site wiring its own banner controller gates its
#     advertising without trying to replace a CMP. In gated mode the
#     site's banner is the decision point; the theme's test fixture
#     (test/fixture) is the working reference.
#   "none": the theme performs no gating and the loader ships in head on unit
#     pages. Use this only when the site or its external CMP owns the consent
#     decision; a Google-certified CMP is the normal path where Google requires
#     one (support.google.com/adsense/answer/13554116).
# consent = "none"
# Gated mode also wants the site's consent hook (layouts/partials/
# cookie-consent.html). Set this only when a controller ship outside the
# hook already dispatches CustomEvent("strata:cookie-consent") — a
# certified CMP wiring the documented contract, for example — or the
# build fails naming it.
# externalConsentController = false

# ── Keys below are lowercase: see the header comment. ──────────────────────

[image]
# Variant widths, smallest first. Each step is capped by the source width and
# by the role cap below, de-duplicated, and a step under 15% wider than its
# kept predecessor is dropped. Four is the working maximum per role — a source
# used by several roles carries each role's steps.
ladder = [480, 800, 1280, 1600]

# One WebP quality for every width, so the same width is never written twice.
quality = 78

[image.caps]
card = 800
# Hero and illustration deliberately share the default cap so the same source
# reuses one transform ladder. Separate keys remain as site override hooks.
illustration = 1600
hero = 1600

# The social preview is generated at a fixed size: 1200x630 is what Facebook,
# LinkedIn and Google request. scripts/place-image.sh lints the source against
# this same pair.
[image.og]
width = 1200
height = 630

[build]
# Largest total image payload on a page, in KiB — check-build R5.
pageimageskb = 600

# Largest file count of the whole build output — check-build R16. 20,000 is
# Cloudflare Pages' free-tier ceiling; the paid tier raises it to 100,000.
maxfiles = 20000

# Largest source image scripts/place-image.sh will copy into a site, in KiB.
# The pipeline re-encodes at a capped width and one quality, so a source that
# large buys build time and repository size, never reader bytes.
maxsourcekb = 12000

[build.minwidth]
hero = 1600
illustration = 1600
card = 1200
og = 1200
