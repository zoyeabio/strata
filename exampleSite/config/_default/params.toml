# Overrides only. Every key the theme reads has a default in the theme's own
# config/_default/params.toml — the reference, with a comment on each key — and
# docs/configuration.md explains them. This file lists just the keys this
# example sets differently, so a key left out here inherits the theme default.
# Delete this file and the theme still builds.
description = "A content-first Hugo theme for independent sites. This site is the theme's own example: every page exercises a real feature."
eagerCardCount = 3
# Absent from the theme on purpose: an empty slice is truthy in `with`, so
# absent means every single is an article. This site narrows it to posts.
mainSections = ["posts"]
# The home page has no hero of its own, so its social card needs an explicit
# image; pages with a featureimage keep it.
defaultSocialImage = "images/hero-home.png"
twitterSite = "@stratastudio"
twitterCreator = "@stratastudio"
enableSearch = true
enableA11y = true
defaultAppearance = "auto"
# Loaded after the theme's own bundle, so these rules win at equal
# specificity. Every rule in the file is consumed by markup this site emits
# through layouts/partials/, which is the intended use.
customCSS = ["css/example.css"]

[header]
  layout = "smart"

[search]
  contentLength = 600

[list]
  showSummary = true
  showBreadcrumbs = true
  showHero = true

[article]
  showBreadcrumbs = true
  showAuthor = true
  showRelatedContent = true
  showSummary = true
  sharingLinks = ["linkedin", "facebook", "email", "whatsapp"]

[author]
  name = "Strata Studio"
  url = "/about/"
  links = [{ name = "GitHub", url = "https://example.com/" }]

[taxonomy]
  showBreadcrumbs = true

[term]
  showBreadcrumbs = true

[footer]
  showAppearanceSwitcher = true
  showScrollToTop = true

  [footer.company]
    name = "Strata Studio"
    slogan = "Independent sites, built to last."
    email = "hello@strata.example"
    phone = "+1 555 0100"
    address = "14 Foundry Lane<br>Portland, OR"

  [footer.quickLinks]
    title = "Explore"
    links = [
      { name = "Features", url = "/features/" },
      { name = "Shortcodes", url = "/shortcodes/" },
      { name = "Gallery", url = "/gallery/" },
      { name = "Posts", url = "/posts/" },
    ]

  [footer.legal]
    title = "Site"
    links = [
      { name = "Docs", url = "/docs/" },
      { name = "About", url = "/about/" },
      { name = "Contact", url = "/contact/" },
      { name = "Privacy", url = "/privacy-policy/" },
      { name = "Cookies", url = "/cookies/" },
      { name = "Terms", url = "/terms/" },
    ]

  [footer.social]
    links = [
      { name = "LinkedIn", icon = "linkedin", url = "https://www.linkedin.com/" },
      { name = "Instagram", icon = "instagram", url = "https://www.instagram.com/" },
      { name = "Facebook", icon = "facebook", url = "https://www.facebook.com/" },
      { name = "Email", icon = "email", url = "mailto:hello@strata.example" },
    ]
